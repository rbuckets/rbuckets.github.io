<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayako</title>
<meta name="robots" content="noindex">
<style>
  :root { --paper: #E3E8EC; --ink: #0E1A22; --soft: #52677A; --sea: #1C6A86; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #05080B; --ink: #D3E5EC; --soft: #6E8B9B; --sea: #8FC7D9; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--paper); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 340px; padding: 32px 16px; text-align: center; }
  .label { color: var(--sea); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 8px 0 12px; }
  p { color: var(--soft); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="label">Ayako</div>
  <h1>Ayako</h1>
  <p>Basketball workouts, drills and clips.</p>
</main>
</body>
</html>
